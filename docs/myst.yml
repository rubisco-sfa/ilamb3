# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: c27ca160-5168-45a6-8ac4-6f8e3e2e94f9
  title: ilamb3 Documentation
  # description:
  # keywords: []
  # authors: []
  github: https://github.com/rubisco-sfa/ilamb3
  plugins:
    - assets/myst-apidoc/myst-apidoc-plugin/dist/index.mjs
  toc:
    - file: index.md
    - title: Getting Started
      file: getting-started/index.md
      children:
        - file: getting-started/installation.md
        - file: getting-started/quickstart.md
    - title: Tutorials
      file: tutorials/index.md
      children:
        - file: tutorials/configure-yaml.md
        - file: tutorials/intake.md
        - file: tutorials/organize.md
        - file: tutorials/global-options.md
    - title: Deep Dive
      file: deep-dive/index.md
      children:
        - file: deep-dive/transforms.md
        - file: deep-dive/analysis.md
    - title: Reference
      children:
        - file: reference/glossary.md
        - file: reference/datasets.md
        - file: reference/api/index.md
          children:
            - pattern: reference/api/!(index).md
              sort: ascending
    - title: Contribute
      file: contribute/index.md
      children:
        - file: contribute/develop.md
        - file: contribute/datasets.md
        - file: contribute/replicate-docs.md
site:
  template: book-theme
  options:
    #   favicon: favicon.ico
    folders: true
    logo_text: ilamb3
    style: api.css
